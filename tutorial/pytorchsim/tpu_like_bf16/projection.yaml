# ============================================================================
#  PyTorchSim projection
# ============================================================================
# This file maps each PyTorchSim action to { element: stim_mode }. It also
# gives the source of the event count of each action.
# 'hold_b' means that operand b is latched one time, which is weight-stationary
# operation. This is a property of the hardware, not of the simulator. Thus
# compute maps to hold_b in this file and in the Timeloop projection. The two
# harnesses can then use the same compound.
#
# The compute action is charged per useful MAC (useful_macs: the MAC count
# of the operator, from the operation name in the log and the shapes in
# meta.txt). The active PE cycles above that count are PEs that hold no real
# weight (array_idle_slots); the CustomMatMulIdle action charges them in the
# idle mode. NPUWattch assumes clock gating: an idle PE is clock-gated and
# costs leakage only (no dynamic energy). To model a PE without clock gating,
# set `clock_gating: false` on the pe element in compound_components.yaml.
# The weight-register write is one access: E_write - E_idle of the regfile.
# The gem5 instruction counts (pushes, pops, SFU operations) come from the
# sample program and are scaled by the tile graph (*_tog.py) to the kernel.
#
# CustomMatMuliVpush (input push) and CustomMatMulvpop (partial-sum pop) drive
# the VPU scratchpad of each lane (the spads compound below). They do not
# drive more systolic elements. In the array, 'hold_b' already includes them,
# because hold_b drives operand a and addend c. A second mapping to pe would
# count that energy two times.
#
# Rule: ENERGY uses count_from (events for each cycle). AREA and LEAKAGE use
# the 'count' of the compound element. Do not multiply the two.
# See docs/COMPOUND_SCHEMA.md §3.

tool: pytorchsim

# Declared exclusions. NPUWattch shows them as notes (INFO), not as warnings.
#   waivers       The reader collects the stat, but the projection does not
#                 charge it. Each waiver gives the reason. This is the same
#                 meaning as a waiver in a lint or CDC tool.
#   out_of_scope  Hardware that is outside the model scope. The readers do not
#                 collect its activity, thus there is no stat to waive.
# If a stat has activity and is not declared here, NPUWattch gives the
# coverage warning. That warning then means that a mapping is possibly missing.
waivers:
  CustomMatMul: >-
    compute is charged as useful MACs (useful_macs action) plus idle PE
    cycles (array_idle_slots action); this instruction count is a redundant
    counter of the same work
  systolic_active_cycles: >-
    the active cycles of the arrays are split into useful_macs and
    array_idle_slots, which the systolic_mac actions charge; the raw cycle
    count also gives the share of each array
  comp_gemm_ops: >-
    COMP GEMM op counter: the same GEMM work is charged as useful MACs
    (CustomMatMul action) plus idle PE cycles (CustomMatMulIdle action);
    charging both would double-count
  comp_vector_ops: >-
    COMP vector op counter: the same vector work is charged per vector-unit
    active cycle (vpu compound actions); charging both would double-count

out_of_scope:
  - >-
    scalar core (with its L1 I-cache / D-cache, branch predictor and TLBs) is
    excluded from the energy model; gem5 stats are read only for numCycles and the instruction counts matching
    CustomMatMul(wVpush|iVpush|vpop)? and CustomV(exp|exp2|erf|tanh|sin|cos)
  - >-
    CustomVlaneIdx instruction counts are deliberately not collected: it is
    lane-index generation, not an SFU op, and its energy is negligible
  - >-
    BAR / MEMORY_BAR (barrier) instruction counters are not collected:
    synchronization is control-side work (scalar-core scope) and the stall
    time it causes is already inside total_exec_cycles, so it is charged as
    leakage over the window
  - >-
    VCIX serializer/deserializer (the vector <-> systolic-array interface) is
    not modeled as a separate component: its push/pop events are already
    charged at both endpoints (w_reg writes, vpu_spad reads/writes), and
    PyTorchSim exposes no serdes size parameters — the remaining mux/wire
    datapath is second-order
  - >-
    DRAM background/standby power and the NPU-side memory controller / HBM PHY
    are not charged: vendor IDD/standby currents for HBM are not public (no
    open HBM power tool exists), so the dram compound charges command energies
    only (activate / read / write / refresh, constants cited from O'Connor &
    Chatterjee et al., MICRO 2017); the on-chip consequences of DRAM traffic
    (scratchpad fills/drains, DMA engine, NoC flits) are charged by their own
    compounds

# Planned integrations of external power models that are not implemented.
# Each entry gives a warning in each run, because it is a temporary gap. An
# out_of_scope entry is permanent. Delete an entry when its integration is
# complete.
# The list is empty. The `dram` compound below charges the DRAM device energy
# from the controller counters in the "=== DRAM statistics ===" block of
# Ramulator2. An external tool is not necessary: the log gives the measured
# row hit/miss/conflict split, and no public power tool models HBM.
third_party_pending: []

compounds:

  systolic_mac:

    CustomMatMul:                     # weight-stationary compute: the useful MACs
      count_from:
        stat: useful_macs             # M·K·N of the operator (log operation + meta.txt shapes)
      elements:
        pe: random                    # one bf16 product (fpmul has no held-operand mode: random is the closest)
        acc: random                   # one fp32 add of the product into the partial sum
        acc_reg: write                # the partial-sum register takes the new sum
                                      # w_reg is not named: the weight stays, clock-gated (leakage only)

    CustomMatMulIdle:                 # active PE cycles without a real weight: everything is clock-gated
      count_from:
        stat: array_idle_slots        # systolic_active_cycles × lanes² − useful_macs
      elements:
        w_reg: idle                   # leakage only (pe, acc and acc_reg are gated by default_mode)

    CustomMatMulwVpush:               # weight load (push of a new weight)
      count_from:
        stat: CustomMatMulwVpush
        scale: "lanes*vector_elems"   # one push = one vector register of each lane
      elements:
        w_reg: write                  # the weight-register write = weight-load energy; the PE is gated

    # Sparsity variant: if the log gives the activation sparsity, map
    # CustomMatMul.pe -> sparse50 and not hold_b.

  # --------------------------------------------------------------------------
  # spads (default_mode: gated)
  # --------------------------------------------------------------------------
  # An action charges only the element that it names. A scratchpad that an
  # action does not use is clock-gated, and §6 charges only its leakage.
  # First-order traffic model (the emitter gives a warning):
  #   The DMA fills the lane scratchpads from DRAM and drains them to DRAM.
  #     DRAM read bytes  ~ scratchpad writes
  #     DRAM write bytes ~ scratchpad reads
  #     (bytes = request count x dram_req_size_byte)
  #   One iVpush or vpop instruction moves one vector register of each lane
  #   through the lane scratchpad: `lanes x vector_elems` elements of the
  #   operand dtype (vector_elems = vpu_vector_length_bits / bitwidth).
  # `unit` converts a stat count into words of the capacity-resolved macro:
  #   bytes:    bytes / word bytes
  #   vectors:  vectors x lanes x bitwidth / word bits
  #             (`scale: vector_elems` gives the register width)

  spads:

    spad_fill:                        # DRAM -> lane scratchpads (MOVIN traffic)
      count_from:
        stat: dram_read_bytes
        unit: bytes
      elements:
        vpu_spad: write

    spad_drain:                       # lane scratchpads -> DRAM (MOVOUT traffic)
      count_from:
        stat: dram_write_bytes
        unit: bytes
      elements:
        vpu_spad: read

    input_push:                       # read of the activations from the lane scratchpad
      count_from:
        stat: CustomMatMuliVpush
        unit: vectors
        scale: vector_elems           # one push = one vector register of each lane
      elements:
        vpu_spad: read

    psum_pop:                         # write of the partial sums to the lane scratchpad
      count_from:
        stat: CustomMatMulvpop
        unit: vectors
        scale: vector_elems           # one pop = one vector register of each lane
      elements:
        vpu_spad: write

  # --------------------------------------------------------------------------
  # vpu (vector datapath of one core: VRF + representative VFU, the `vpu` compound)
  # --------------------------------------------------------------------------
  # One active cycle of the vector unit is one vector operation in `lanes`
  # SIMD slots. This is a first-order model, because the log does not divide
  # the cycles by operation type.
  # Each slot operation has 2 VRF operand reads, 1 VRF result write, and 1 FU
  # operation.
  # All three actions use the same stat, and that stat is exact for each core.
  # Thus the split between instances is exact (instances.py).

  vpu:

    vfu_op:                           # one slot operation for each lane in each active cycle
      count_from:
        stat: vector_active_cycles
        scale: lanes
      elements:
        vfu: random

    vrf_operand_read:                 # two operand reads for each slot operation
      count_from:
        stat: vector_active_cycles
        scale: "lanes*2"
      elements:
        vrf: read

    vrf_result_write:                 # one result write for each slot operation
      count_from:
        stat: vector_active_cycles
        scale: lanes
      elements:
        vrf: write

  # --------------------------------------------------------------------------
  # dma (DMA engine of one core, docs/DESIGN_SFU_DMA.md §1)
  # --------------------------------------------------------------------------
  # One DRAM request is one queue transit and one address add. The fifo mode
  # 'stream' is one push and one pop for each event.
  # dram_requests = [DRAM] reads + writes (activity.read_run). The DMA response
  # counters of each core in the log give the exact split between cores
  # (instances.py).
  # The scratchpad traffic and the NoC flits already charge the energy of the moved
  # data. This compound charges only the engine datapath.

  dma:

    dma_request:                      # queue transit + address generation
      count_from:
        stat: dram_requests
      elements:
        dma_q: stream
        dma_addr: random

  # --------------------------------------------------------------------------
  # fpsfu (SFU of one core, docs/DESIGN_SFU_DMA.md §2)
  # --------------------------------------------------------------------------
  # One committed CustomV* instruction works on one vector register group in
  # each of the `lanes` lanes. The harness reads the group width from the
  # vector type of the math operation in the kernel MLIR (sfu_vector_elems,
  # message NW-6225). Thus:
  #   events = count × lanes × sfu_vector_elems
  # CustomMatMulwVpush uses `lanes × vector_elems` (one vector register).
  # Each gem5 class maps to the stim_mode of the operation group that does it.
  # `CustomVlaneIdx` generates lane indexes and is not an SFU operation. The
  # reader does not collect it.

  fpsfu:

    vexp:
      count_from: { stat: CustomVexp, scale: "lanes*sfu_vector_elems" }
      elements: { sfu_pipe: exp }

    vexp2:
      count_from: { stat: CustomVexp2, scale: "lanes*sfu_vector_elems" }
      elements: { sfu_pipe: exp }

    verf:
      count_from: { stat: CustomVerf, scale: "lanes*sfu_vector_elems" }
      elements: { sfu_pipe: erf }

    vtanh:
      count_from: { stat: CustomVtanh, scale: "lanes*sfu_vector_elems" }
      elements: { sfu_pipe: hyp }

    vsin:
      count_from: { stat: CustomVsin, scale: "lanes*sfu_vector_elems" }
      elements: { sfu_pipe: trig }

    vcos:
      count_from: { stat: CustomVcos, scale: "lanes*sfu_vector_elems" }
      elements: { sfu_pipe: trig }

  # --------------------------------------------------------------------------
  # noc (BookSim2 interconnect. booksim.py calculates the stats and the topology symbols)
  # --------------------------------------------------------------------------
  # Each BookSim packet in these runs is one flit of flit_size bytes (average
  # packet length = 1). Each DRAM request goes through the network two times,
  # as a request and as a response:
  #   total flits = 2 x (DRAM reads + DRAM writes)
  # This agrees with the log value: injected rate x nodes x cycles.
  # icnt_xbar_flits includes the second switch traversal of the inter-chiplet
  # flits. This applies to anynet and assumes uniform traffic, and the reader
  # gives a warning.
  # icnt_d2d_flits counts only the die-to-die crossings.
  #
  # `unit: flits`: the emitter converts for each element type (§3.9):
  #   sram buffer -> flit_bits / word_bits word accesses (write in, read out)
  #   crossbar    -> flits / (valid_fraction(mode) x ports) active cycles
  #                  valid25 is the characterized partial-activity point.
  #                  The division by its 25% keeps the energy proportional to
  #                  the flits, so the utilization of a run does not matter.
  #   d2dlink     -> one crossing for each flit

  noc:

    xbar_traverse:                    # a flit goes through the switch datapath
      count_from:
        stat: icnt_xbar_flits
        unit: flits
      elements:
        icnt_xbar: valid25

    buf_ingress:                      # a flit goes into the input buffer
      count_from:
        stat: icnt_xbar_flits
        unit: flits
      elements:
        icnt_buf: write

    buf_egress:                       # a flit goes out of the input buffer
      count_from:
        stat: icnt_xbar_flits
        unit: flits
      elements:
        icnt_buf: read

    d2d_cross:                        # an inter-chiplet flit crosses one channel
      count_from:
        stat: icnt_d2d_flits
        unit: flits
      elements:
        icnt_d2d: random

  # --------------------------------------------------------------------------
  # dram (HBM device energy. The constants come from a DRAM energy table, see npuwattch_harness/pytorchsim/dram.py)
  # --------------------------------------------------------------------------
  # The command counts come from the "=== DRAM statistics ===" controller
  # block of Ramulator2 (activity.py). The block gives the measured row
  # hit/miss/conflict split. Thus the ACT command count is exact and is not an
  # assumption.
  # The stats are totals for the chip (the sum of all channels). This agrees
  # with the `per: chip` element.
  # If a log does not have the block, the reader uses the [DRAM] request
  # totals for read and write only, and gives a warning. Then dram_act_cmds
  # and dram_ref_cmds are absent, and those actions are not bound.

  dram:

    dram_activate:                    # ACT+PRE for each row miss or conflict
      count_from:
        stat: dram_act_cmds
      elements:
        dram_chan: activate

    dram_read:                        # one read command = data_width bits out
      count_from:
        stat: dram_read_cmds
      elements:
        dram_chan: read

    dram_write:                       # one write command = data_width bits in
      count_from:
        stat: dram_write_cmds
      elements:
        dram_chan: write

    dram_refresh:                     # REFab maintenance command
      count_from:
        stat: dram_ref_cmds
      elements:
        dram_chan: refresh
