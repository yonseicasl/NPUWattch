# ============================================================================
#  Timeloop projection
# ============================================================================
# The projection connects the Timeloop events of a component to the elements
# of its compound (compound_components.yaml). This file is an INPUT of the
# run: NPUWattch reads `projection.yaml` from the directory of the
# architecture file, or the file that you give with --projection.
#
# The Timeloop stats give three events for a level:
#   read      one read access (scalar reads / block size)
#   write     one write access (fills + updates, / block size)
#   compute   one compute operation (Computes)
#
# For each event, `elements` gives the stim_mode of each element that the
# event drives. An element that the action does not name follows the
# `default_mode` of the compound: `gated` charges nothing, `idle` charges one
# idle. `count_from.scale` multiplies the event count. `count_from.stat` is
# the name of the Timeloop counter. It is information only.
#
# Clock gating: NPUWattch assumes that each block is clock-gated. An idle
# element costs leakage only, so `gated` and `idle` give the same energy. A
# register-file read or write is one access: E_mode - E_idle, without the
# clock tree of the full array. A MAC compute is one active cycle: E_mode.
# To model a block without clock gating, give its Accelergy component the
# attribute `clock_gating: false` (arch.yaml). Its idle cycles then cost the
# clocked idle energy, and the run gives INFO (NW-3105).
#
# A component gets these events if a stats level has its name, or if
# --stats-map connects a level to it.

tool: timeloop

compounds:

  counter:
    compute:                          # one count step
      count_from:
        stat: computes
        scale: 1
      elements:
        increment: random
        state: write
