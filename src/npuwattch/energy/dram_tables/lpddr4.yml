# LPDDR4 off-chip DRAM energy constants, in pJ.
#
# This table has only the transfer energy for each bit. The source gives one
# access energy for each bit. It gives no row activation energy and no
# refresh energy.
# The table is sufficient for Timeloop, because its stats have no ACT or REF
# events. PyTorchSim counts ACT commands. Thus a PyTorchSim run does not
# accept a table that has no row_activation_pj.
#
# Source: Accelergy CactiDRAM type table (accelergy-cacti-plug-in). That table
# shows the value as "public data".
# Timeloop and Accelergy use the same value for a DRAM of type "LPDDR4".
name: LPDDR4

offchip_dram:
  transfer_pj_per_bit:
    access: 8.0
