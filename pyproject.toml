[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npuwattch"
dynamic = ["version"]
description = "NPUWattch"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "Jinja2>=3.1",
  "rich>=13.0",
  "torch",
  "PyYAML>=6.0"
]

[project.scripts]
npuwattch = "npuwattch.npuwattch_console:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Report template + JSON schema (manual §8 / §3.6).
"npuwattch.report" = ["templates/*.j2", "schema.json"]
# System contract for the compound interpreter.
"npuwattch_harness.compounds" = ["data/*.json", "data/*.md"]
# Shipped per-type DRAM energy tables (Timeloop DRAM `type`, --energy-table).
"npuwattch.energy" = ["dram_tables/*.yml", "link_tables/*.yml"]
# Per-harness vocabulary table. The definitions of a design (compound
# components, projection, user components) are inputs of a run, not package data.
"npuwattch_harness.pytorchsim" = ["definitions/*.md", "definitions/*.yaml"]
"npuwattch_harness.timeloop" = ["definitions/*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "npuwattch._version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
