[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npuwattch"
dynamic = ["version"]
description = "NPUWattch"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "Jinja2>=3.1",
  "torch",
  "PyYAML>=6.0"
]

[project.scripts]
npuwattch = "npuwattch.npuwattch_console:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# System contract for the compound interpreter.
"npuwattch.harness.compounds" = ["data/*.json", "data/*.md"]
# Per-harness definition bundles (compounds + projections), JSON or YAML.
"npuwattch.harness.pytorchsim" = [
  "definitions/*.md",
  "definitions/compounds/*.json", "definitions/compounds/*.yaml", "definitions/compounds/*.yml",
  "definitions/projections/*.json", "definitions/projections/*.yaml", "definitions/projections/*.yml",
]
"npuwattch.harness.timeloop" = [
  "definitions/projections/*.json", "definitions/projections/*.yaml", "definitions/projections/*.yml",
]

[tool.setuptools.dynamic]
version = {attr = "npuwattch._version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
